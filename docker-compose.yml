services:
  db:
    image: postgres:16-alpine
    container_name: nikmohaseb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nikmohaseb
      POSTGRES_PASSWORD: nikmohaseb123
      POSTGRES_DB: nikmohaseb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikmohaseb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: nikmohaseb-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads

volumes:
  db-data:
  uploads:
